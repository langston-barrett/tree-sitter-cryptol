name: ci
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Check that the generated parsers are up to date
      run: |
        script/generate
        git diff --exit-code
    - run: npx tree-sitter test
    - run: npx tree-sitter test -p expr
    - run: npx tree-sitter test -p type
    - run: npm test
    - run: cargo test

  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Compile the scanner with warnings as errors
      run: |
        for cc in gcc clang; do
          "${cc}" --version | head -n 1
          for scanner in src/scanner.c expr/src/scanner.c type/src/scanner.c; do
            "${cc}" -std=c11 -Isrc -c "${scanner}" -o /dev/null \
              -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror
          done
        done
