# Publish to crates.io when a tag `v*` is pushed.  Pushes to `release*`
# branches (and changes to this file) do a dry run.
#
# Like langston-barrett/gha's rust-release.yml, but without uploading
# binaries, as this crate has none.
name: release
on:
  push:
    branches:
    - release*
    tags:
    - v*
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: cargo test

    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      with:
        artifactErrorsFailBuild: true
        body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
        draft: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to crates.io
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: | # zizmor: ignore[use-trusted-publishing] matches other crates
        if [[ "${PUSH}" == true ]]; then
          cargo publish --token="${CRATES_IO_TOKEN}"
        else
          cargo publish --dry-run
        fi
